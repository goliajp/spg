# SPG cargo-deny config (v4.31).
# Run locally: cargo install cargo-deny && cargo deny check
# CI gates this via .github/workflows/ci.yml::cargo-deny

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Ignored advisories — limit to vulns that only surface through
# transitive deps of `xtests/`/`xbench/` (test-only, never shipped
# in published crates).
ignore = [
    # RUSTSEC-2023-0071 — Marvin timing sidechannel in `rsa`.
    # Pulled in transitively by `sqlx-postgres` (xtests/sqlx-pgwire)
    # for PG md5 / scram-sha-256 password hashing. xtests run only
    # against loopback test fixtures; no shipped binary or library
    # exposes the rsa code path. Will drop the ignore once sqlx
    # ships a fix or we replace sqlx in xtests with a hand-rolled
    # PG protocol harness.
    "RUSTSEC-2023-0071",
]

[licenses]
# spg-* crates are MIT OR Apache-2.0 (workspace-wide). Bench-only
# deps may add MPL / ISC / Unicode-3.0 — that's fine.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93

[[licenses.exceptions]]
# ring uses a unique combination not represented by a SPDX expr
name = "ring"
allow = ["LicenseRef-ring"]

[[licenses.clarify]]
name = "ring"
expression = "LicenseRef-ring"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Disallow multiple semver-incompatible versions of the same crate.
# Bench-only deps (sqlx + tokio) bring some duplication; warn for
# now, tighten to deny after v5.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
