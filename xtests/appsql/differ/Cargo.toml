# Standalone: this is a hand-run investigation tool, not a gate, and
# its sqlx dependency has no business in every workspace build.
[workspace]

[package]
name = "appsql-differ"
version = "0.0.0"
edition = "2021"
[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
