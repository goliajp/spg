# PG18 oracle config — fast test mode + deterministic output.
#
# `fsync = off` and friends trade durability for cold-start speed —
# every container restart wipes tmpfs anyway, so durability is moot.
# DateStyle / extra_float_digits are determinism knobs: keep
# adjust_*() simple by pinning the textual format.

fsync = off
synchronous_commit = off
full_page_writes = off
shared_buffers = 256MB
max_connections = 50
log_min_messages = warning
log_statement = none
client_min_messages = warning

# Determinism: match PG18 default DateStyle so any port.* fixture
# from `src/test/regress/sql/` lands byte-equal without per-test
# adjust hooks.
DateStyle = 'ISO, MDY'
extra_float_digits = 1
