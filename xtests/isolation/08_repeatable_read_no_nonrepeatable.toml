# v7.39 — the discriminating experiment for "does SPG actually implement
# REPEATABLE READ", which until now nothing here asked. Spec 02 covers
# READ COMMITTED visibility only: a reader OUTSIDE a transaction sees a
# commit. That is true under every isolation level, so it cannot tell the
# levels apart.
#
# Here session 1 reads INSIDE its transaction, session 2 commits, and
# session 1 reads again. Under REPEATABLE READ the second read must be
# unchanged; under READ COMMITTED it must change. Its pair,
# 09_read_committed_sees_concurrent_commit, is the negative control: if
# 09 also reported "unchanged", this harness would be unable to observe
# the difference at all and 08 passing would mean nothing.
[iso]
name = "repeatable_read_no_nonrepeatable"
sessions = 2

[[step]]
id = "setup"
session = 1
sql = "CREATE TABLE rr (x INT)"

[[step]]
id = "seed"
session = 1
sql = "INSERT INTO rr VALUES (1)"

[[step]]
id = "s1_begin"
session = 1
sql = "BEGIN ISOLATION LEVEL REPEATABLE READ"

[[step]]
id = "s1_read1"
session = 1
sql = "SELECT count(*) FROM rr"

[[step]]
id = "s2_insert"
session = 2
sql = "INSERT INTO rr VALUES (2)"

[[step]]
id = "s1_read2"
session = 1
sql = "SELECT count(*) FROM rr"

[[step]]
id = "s1_commit"
session = 1
sql = "COMMIT"

[[step]]
id = "s1_read3"
session = 1
sql = "SELECT count(*) FROM rr"

[[permutation]]
order = "setup seed s1_begin s1_read1 s2_insert s1_read2 s1_commit s1_read3"
