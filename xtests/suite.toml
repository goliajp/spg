# v7.38 suite manifest — the tiers as DATA (design D2).
#
# Flat [[step]] list; file order IS execution order within a tier.
# `impl = "external"` runs `cmd` as a shell command; "internal" names a
# suite-run built-in (errors "not wired" until its checklist item).
# Budgets are provisional until CP0 calibrates them from BASELINE.

[suite]
current_pin_prefix = "pin_v738_"
port_lo = 25460
port_hi = 25479

# ── precommit ─────────────────────────────────────────────────────────

[[step]]
tier = "precommit"
name = "fmt"
impl = "external"
cmd = "cargo fmt --all -- --check"
budget_s = 5

[[step]]
tier = "precommit"
name = "clippy-affected"
impl = "internal"
budget_s = 45

[[step]]
tier = "precommit"
name = "unit-affected"
impl = "internal"
budget_s = 35

[[step]]
tier = "precommit"
name = "pins-current"
impl = "external"
cmd = "cargo test -q -p spg-engine --test e2e pin_v738_"
budget_s = 10

[[step]]
tier = "precommit"
name = "slt-smoke"
impl = "external"
cmd = "cargo run -q -p sqllogictest -- --list xtests/sqllogictest/corpus/PRECOMMIT.list"
budget_s = 15

[[step]]
tier = "precommit"
name = "ironrule-smoke"
impl = "internal"
budget_s = 10

