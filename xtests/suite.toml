# v7.38 suite manifest — the tiers as DATA (design D2).
#
# Flat [[step]] list; file order IS execution order within a tier.
# `impl = "external"` runs `cmd` as a shell command; "internal" names a
# suite-run built-in (errors "not wired" until its checklist item).
# Budgets WERE provisional "until CP0 calibrates them from BASELINE",
# and CP0 never ran. They stayed guesses through every release since,
# and the guesses were wrong in both directions: `gates` was over budget
# on every prerelease run for months -- 665-743s against 480 -- while
# `perf-sweep` was given 900s for a step that takes 182, and `ironrules`
# 120s for one that takes half a second. A tripwire set five times too
# high catches nothing; one set permanently too low is reported, ignored,
# and teaches the reader to skip the line.
#
# v7.38.18 calibrated the prerelease tier from ten recorded runs on the
# testbed (2026-08-23). Each budget below is the observed maximum times
# roughly 1.5, and the observations are written beside it so the next
# calibration compares against numbers rather than starting over. The
# `unit` figure ignores one 660s run: that was the first build after a
# workspace version bump, a full rebuild, and an occasional cold-build
# overrun is exactly what "recorded, not blocking" is for.

[suite]
current_pin_prefix = "pin_v738_"
port_lo = 25460
port_hi = 25479
# D20 — peak-RSS ceiling (MB) for suite-owned server legs; enforced at
# reap in the sweep step. Basis: v7.37 sweep legs peak well under 1 GB
# on the 400k-row shapes; 4x headroom keeps this a tripwire for
# runaway residency (the r30-era 12 GB inbox class), not a flake.
rss_ceiling_mb = 4096

# ── precommit ─────────────────────────────────────────────────────────

[[step]]
tier = "precommit"
name = "fmt"
impl = "external"
cmd = "cargo fmt --all -- --check"
budget_s = 5

[[step]]
tier = "precommit"
name = "clippy-changed"
impl = "internal"
budget_s = 45

[[step]]
tier = "precommit"
name = "unit-changed"
impl = "internal"
budget_s = 35

[[step]]
tier = "precommit"
name = "pins-current"
impl = "internal"
budget_s = 10

[[step]]
tier = "precommit"
name = "slt-smoke"
impl = "external"
# v7.39.12 — the binary this tier already built, run directly.
#
# `cargo run -p sqllogictest` names one member, and `cargo build
# --workspace` names all of them; either is a different member set from
# the one `unit-changed` and `pins-current` use, and cargo resolves
# features over the selected members — so this step rebuilt the graph
# between them. `sqllogictest` is IN that shared selection now (see
# `precommit_selection`), so its binary exists by the time this runs.
cmd = "cargo build -q --workspace --exclude spg-bench-competitor --locked --bin sqllogictest && target/debug/sqllogictest --list xtests/sqllogictest/corpus/PRECOMMIT.list && SPG_SLT_DB_COLLATION=en_US.utf8 target/debug/sqllogictest --list xtests/sqllogictest/corpus/PRECOMMIT.list"
# v7.38.18 — 45, and the number is two things, not one.
#
# The corpus itself is 1.5-2.0 s: 413 cases, measured twice on a warm
# build. The rest is `cargo run` rebuilding the workspace in debug,
# which is what precommit exists to run right after — so the step is
# fast when nothing changed and 15-20 s when spg-sql or spg-engine did.
#
# At 15 the budget sat exactly across that split, and this step's colour
# depended on whether some earlier command had warmed the cache. It
# failed the v7.38.18 release commit -- a CHANGELOG-only commit, whose
# own affected-crate steps correctly skipped -- because commits before it
# had touched three crates. A hard gate that a rebuild decides is not
# measuring the thing it names.
#
# Observed: 0.8 / 5.1 / 6.0 / 15.4 / 19.7 s across five runs. The tier's
# own 150 s cap is the real guard and had 125 s to spare on the run that
# tripped this one.
budget_s = 15

[[step]]
tier = "precommit"
name = "ironrule-smoke"
impl = "internal"
budget_s = 10

# ── prerelease ────────────────────────────────────────────────────────

[[step]]
tier = "prerelease"
name = "lint"
impl = "external"
cmd = "scripts/gate.sh lint"
# observed 120 / 138 / 220 (min/med/max, n=6)
budget_s = 330

[[step]]
# v7.39.12 — doc tests moved off the release path.
#
# The step is rustdoc alone now: `--lib --bins` left it because that
# set was a subset of e2e's with nothing left over. What remains costs
# 441 s on an UNCHANGED tree — every run, whatever changed — against a
# 2,485 s tier, so it is 18% of the release path spent proving that doc
# examples still compile.
#
# That is worth knowing and it is not worth knowing before every
# release, so it runs nightly with the rest of `full`. A doc example
# that stops compiling is a documentation defect; it cannot reach a
# user through the published binary.
tier = "full"
name = "unit"
impl = "external"
cmd = "scripts/gate.sh unit"
# observed 441 s on an unchanged tree (rustdoc compiles every example
# whether or not anything changed).
budget_s = 660

[[step]]
tier = "prerelease"
name = "release-build"
impl = "external"
cmd = "scripts/gate.sh release-build"
# v7.39.13 — the fat-LTO build of the workspace plus every release test
# harness, which `gates`, `biz`, `dogfood` and the perm-runner all need.
#
# It was inside `e2e` from 2026-09-03, judged by a budget derived on
# 2026-08-17 from an `e2e` that built nothing.
#
# 165.7 s, measured once on the testbed 2026-09-04 — the first run that
# could see this step at all. 250 is 1.5x that, the rule c81f818b
# states, applied here to a single observation because there is only
# one; it widens when there is a spread to apply it to.
budget_s = 250

[[step]]
tier = "prerelease"
name = "e2e"
impl = "external"
cmd = "scripts/gate.sh e2e"
# observed 94 / 205 / 360 (min/med/max) over the last ten prerelease
# runs recorded in target/suite. The line here used to read
# "297 / 320 / 494 (n=6)" beside a budget of 480 -- 320 x 1.5, the rule
# c81f818b states applied to the SECOND largest observation, with the
# 494 above it silently skipped. It was the only budget in this file
# sitting below a number the file itself recorded. The measurements have
# moved on since; 480 is 1.33x the largest of the last ten.
budget_s = 480

[[step]]
tier = "prerelease"
name = "gates"
impl = "external"
cmd = "scripts/gate.sh gates"
# observed 665 / 696 / 743 (n=6) -- was 480, over on every run
budget_s = 1080

[[step]]
tier = "prerelease"
name = "biz"
impl = "external"
cmd = "scripts/gate.sh biz"
# observed 343 / 348 / 376 (n=5)
budget_s = 540
# S4.6 — biz (embedded corpus + compat, no suite ports) and dogfood
# (embedded replay, no ports) overlap safely; ~real CPU overlap.
group = "corpus"

[[step]]
tier = "prerelease"
name = "dogfood"
impl = "external"
cmd = "scripts/gate.sh dogfood"
# observed 110 / 158 / 177 (n=6)
budget_s = 270
group = "corpus"

[[step]]
tier = "prerelease"
name = "perf-sweep"
impl = "internal"
# observed 138 / 148 / 182 (n=4) with one SPG leg; the third control leg
# costs ~34s. v7.38.19 added a SECOND panel -- a locale-collation leg
# measured against the C leg, at the largest row count only -- because
# all sixty-four cells of the first panel run under `C` and could not
# see a factor-of-twenty-six regression that shipped in v7.38.18.
# v7.38.24 -- that re-calibration, from measurement at last. The three
# panels have now been recorded ten times: 350 / 376 / 397 / 359 / 367 /
# 427 / 360 / 663 / 585 / 634 seconds, in that order (the third of those
# is a run the step failed, timed anyway). The step really did get
# longer where the third panel landed: the last three mean 627s against
# 377s for the seven before them, and 600 sat under two of the three.
# 663 x 1.5.
budget_s = 1000

[[step]]
tier = "prerelease"
name = "ironrules"
impl = "internal"
# observed 0.3 / 0.5 / 0.5 (n=4) -- was 120
budget_s = 60

# ── full ──────────────────────────────────────────────────────────────

[[step]]
tier = "full"
name = "prerelease-all"
impl = "external"
cmd = "scripts/suite.sh prerelease"
# v7.38.24 -- calibrated from measurement. c81f818b calibrated the
# prerelease steps and left the full tier's alone, so this one kept its
# guess. The last ten prerelease runs recorded in target/suite totalled
# 844 / 943 / 964 / 1545 / 1905 / 2181 / 2215 / 2270 / 2402 / 2558
# seconds -- all ten ran all nine steps, so none is a short abort -- and
# 1500 sat under seven of them. That is the same "over on every run,
# reported, ignored" failure c81f818b was written to fix, one tier up.
# 2558 x 1.5.
budget_s = 3800

[[step]]
tier = "full"
name = "deep-tier"
impl = "external"
cmd = "scripts/gate.sh all --full"
# observed 552 / 624 / 952 (min/med/max) over the ten full-tier runs
# recorded in target/suite. c81f818b calibrated the prerelease steps and
# left this tier alone, so 7200 was still a guess -- 7.6x the largest
# run, which is past the "set five times too high catches nothing" line
# that commit drew. 952 x 1.5.
budget_s = 1430

[[step]]
tier = "full"
name = "pgdump-roundtrip"
impl = "internal"
budget_s = 600
# 7.38.1 S5.2 (D6) — official PG18 pg_dump against live SPG must exit
# 0 and the dump must restore into fresh SPG + fresh PG18 with
# identical canary counts (three-way reconciliation).

[[step]]
tier = "full"
name = "perm-matrix"
impl = "internal"
# observed 16 / 63 / 94 (min/med/max) over the ten full-tier runs
# recorded in target/suite. 3600 was 38x the largest of them. 94 x 1.5.
budget_s = 140

# v7.38.17 — promoted from `full`, which nothing runs automatically, to
# the tier that gates a release. Measured end to end: 101 s for all
# three legs including `docker compose up --wait` and teardown, against
# a prerelease tier that already takes ~30 min. The budget is the
# measured time with room, not the old 3600.
#
# It is worth gating now because it can finally see something: until
# this version the runner put SPG in PostgreSQL dialect on every leg,
# so the MySQL and MariaDB comparisons had never once run SPG in MySQL
# semantics.
[[step]]
tier = "prerelease"
name = "oracle-three"
impl = "internal"
# observed 101 / 104 / 108 (n=4) -- was 420
budget_s = 180

[[step]]
tier = "full"
name = "isolation"
impl = "internal"
budget_s = 600

[[step]]
tier = "full"
name = "generative"
impl = "internal"
budget_s = 1200

[[step]]
tier = "full"
name = "sql2016"
impl = "internal"
budget_s = 10

[[step]]
tier = "full"
name = "pgbench"
impl = "internal"
budget_s = 300

[[step]]
tier = "full"
name = "sysbench"
impl = "internal"
budget_s = 1200

[[step]]
tier = "full"
name = "doc-corpus"
impl = "external"
cmd = "cargo run -q --release -p sqllogictest -- --docs"
budget_s = 120
