# v7.38 suite manifest — the tiers as DATA (design D2).
#
# Flat [[step]] list; file order IS execution order within a tier.
# `impl = "external"` runs `cmd` as a shell command; "internal" names a
# suite-run built-in (errors "not wired" until its checklist item).
# Budgets WERE provisional "until CP0 calibrates them from BASELINE",
# and CP0 never ran. They stayed guesses through every release since,
# and the guesses were wrong in both directions: `gates` was over budget
# on every prerelease run for months -- 665-743s against 480 -- while
# `perf-sweep` was given 900s for a step that takes 182, and `ironrules`
# 120s for one that takes half a second. A tripwire set five times too
# high catches nothing; one set permanently too low is reported, ignored,
# and teaches the reader to skip the line.
#
# v7.38.18 calibrated the prerelease tier from ten recorded runs on the
# testbed (2026-08-23). Each budget below is the observed maximum times
# roughly 1.5, and the observations are written beside it so the next
# calibration compares against numbers rather than starting over. The
# `unit` figure ignores one 660s run: that was the first build after a
# workspace version bump, a full rebuild, and an occasional cold-build
# overrun is exactly what "recorded, not blocking" is for.

[suite]
current_pin_prefix = "pin_v738_"
port_lo = 25460
port_hi = 25479
# D20 — peak-RSS ceiling (MB) for suite-owned server legs; enforced at
# reap in the sweep step. Basis: v7.37 sweep legs peak well under 1 GB
# on the 400k-row shapes; 4x headroom keeps this a tripwire for
# runaway residency (the r30-era 12 GB inbox class), not a flake.
rss_ceiling_mb = 4096

# ── precommit ─────────────────────────────────────────────────────────

[[step]]
tier = "precommit"
name = "fmt"
impl = "external"
cmd = "cargo fmt --all -- --check"
budget_s = 5

[[step]]
tier = "precommit"
name = "clippy-affected"
impl = "internal"
budget_s = 45

[[step]]
tier = "precommit"
name = "unit-affected"
impl = "internal"
budget_s = 35

[[step]]
tier = "precommit"
name = "pins-current"
impl = "external"
cmd = "cargo test -q -p spg-engine --test e2e pin_v738_"
budget_s = 10

[[step]]
tier = "precommit"
name = "slt-smoke"
impl = "external"
cmd = "cargo run -q -p sqllogictest -- --list xtests/sqllogictest/corpus/PRECOMMIT.list"
budget_s = 15

[[step]]
tier = "precommit"
name = "ironrule-smoke"
impl = "internal"
budget_s = 10

# ── prerelease ────────────────────────────────────────────────────────

[[step]]
tier = "prerelease"
name = "lint"
impl = "external"
cmd = "scripts/gate.sh lint"
# observed 120 / 138 / 220 (min/med/max, n=6)
budget_s = 330

[[step]]
tier = "prerelease"
name = "unit"
impl = "external"
cmd = "scripts/gate.sh unit"
# observed 290 / 329 / 340 warm (n=6; one 660s cold rebuild excluded)
budget_s = 510

[[step]]
tier = "prerelease"
name = "e2e"
impl = "external"
cmd = "scripts/gate.sh e2e"
# observed 297 / 320 / 494 (n=6)
budget_s = 480

[[step]]
tier = "prerelease"
name = "gates"
impl = "external"
cmd = "scripts/gate.sh gates"
# observed 665 / 696 / 743 (n=6) -- was 480, over on every run
budget_s = 1080

[[step]]
tier = "prerelease"
name = "biz"
impl = "external"
cmd = "scripts/gate.sh biz"
# observed 343 / 348 / 376 (n=5)
budget_s = 540
# S4.6 — biz (embedded corpus + compat, no suite ports) and dogfood
# (embedded replay, no ports) overlap safely; ~real CPU overlap.
group = "corpus"

[[step]]
tier = "prerelease"
name = "dogfood"
impl = "external"
cmd = "scripts/gate.sh dogfood"
# observed 110 / 158 / 177 (n=6)
budget_s = 270
group = "corpus"

[[step]]
tier = "prerelease"
name = "perf-sweep"
impl = "internal"
# observed 138 / 148 / 182 (n=4) -- was 900; the third control leg costs ~34s
budget_s = 300

[[step]]
tier = "prerelease"
name = "ironrules"
impl = "internal"
# observed 0.3 / 0.5 / 0.5 (n=4) -- was 120
budget_s = 60

# ── full ──────────────────────────────────────────────────────────────

[[step]]
tier = "full"
name = "prerelease-all"
impl = "external"
cmd = "scripts/suite.sh prerelease"
budget_s = 1500

[[step]]
tier = "full"
name = "deep-tier"
impl = "external"
cmd = "scripts/gate.sh all --full"
budget_s = 7200

[[step]]
tier = "full"
name = "pgdump-roundtrip"
impl = "internal"
budget_s = 600
# 7.38.1 S5.2 (D6) — official PG18 pg_dump against live SPG must exit
# 0 and the dump must restore into fresh SPG + fresh PG18 with
# identical canary counts (three-way reconciliation).

[[step]]
tier = "full"
name = "perm-matrix"
impl = "internal"
budget_s = 3600

# v7.38.17 — promoted from `full`, which nothing runs automatically, to
# the tier that gates a release. Measured end to end: 101 s for all
# three legs including `docker compose up --wait` and teardown, against
# a prerelease tier that already takes ~30 min. The budget is the
# measured time with room, not the old 3600.
#
# It is worth gating now because it can finally see something: until
# this version the runner put SPG in PostgreSQL dialect on every leg,
# so the MySQL and MariaDB comparisons had never once run SPG in MySQL
# semantics.
[[step]]
tier = "prerelease"
name = "oracle-three"
impl = "internal"
# observed 101 / 104 / 108 (n=4) -- was 420
budget_s = 180

[[step]]
tier = "full"
name = "isolation"
impl = "internal"
budget_s = 600

[[step]]
tier = "full"
name = "generative"
impl = "internal"
budget_s = 1200

[[step]]
tier = "full"
name = "sql2016"
impl = "internal"
budget_s = 10

[[step]]
tier = "full"
name = "pgbench"
impl = "internal"
budget_s = 300

[[step]]
tier = "full"
name = "sysbench"
impl = "internal"
budget_s = 1200

[[step]]
tier = "full"
name = "doc-corpus"
impl = "external"
cmd = "cargo run -q --release -p sqllogictest -- --docs"
budget_s = 120
