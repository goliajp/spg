[package]
name         = "spg-dogfood-replay"
version      = { workspace = true }
edition      = { workspace = true }
authors      = { workspace = true }
license      = { workspace = true }
description  = "SPG dogfood-replay testbed — every customer prod incident encoded as a SPG-internal regression gate."
publish      = false

[[bin]]
name = "spg-dogfood-replay"
path = "src/main.rs"

[[bin]]
# v7.37.7 — concurrent stress harness for mailrs cascade. Single-query
# bench-style measurements have missed the cascade dynamic every cycle;
# this binary closes the blind spot.
name = "spg-stress-cascade"
path = "src/bin/stress_cascade.rs"

[[bin]]
# v7.37.9 Phase 0 — counter readout for mailrs Class A / C SQL.
# Reads atomic counters from spg-engine before / after running the
# fixture's measure SQL. Read-only diagnostic; doesn't modify any
# planner code. See `.claude/notes/v7.37.9-class-a-c-cascade-closure-plan.md`.
name = "spg-counter-dump"
path = "src/bin/counter_dump.rs"

[[bin]]
# v7.38.7 — the child half of the dump-crash-recovery fixture: restores
# a dump, acknowledges writes, then SIGKILLs itself. Separate process
# because a harness cannot kill -9 itself and carry on.
name = "dump-crash-writer"
path = "src/bin/dump_crash_writer.rs"

[dependencies]
libc = "0.2"
# v7.37.5 — dogfood-replay framework. Bin-only crate; the framework
# is intentionally tight on deps so it stays buildable under
# `--locked` without bumping the workspace lockfile. JSON is used
# for the fixture descriptor format (serde already in the lock); tar
# extraction goes through `tar -xzf` on the host (no native dep);
# SHA-256 lives in `sha2` which the workspace already locks.
# v7.39 (round 718) — `perf-counters` is NOT enabled here any more.
# Feature unification meant any workspace-wide build (`cargo test
# --workspace` — the six-gate test leg) silently rebuilt spg-server
# WITH per-row atomic counters: eight parallel shards hammering one
# cache line, measured 7-13x slower on the fused-lane cells. Every
# bench taken from target/release after a workspace build measured
# that tainted binary. The counter statics exist unconditionally, so
# this crate compiles without the feature (counters read 0); when the
# counter_dump diagnostic needs real values, build it explicitly:
#   cargo run --release -p spg-dogfood-replay --bin spg-counter-dump \
#     --features spg-engine/perf-counters
spg-engine   = { path = "../../crates/spg-engine",   version = "7.9" }
spg-embedded = { path = "../../crates/spg-embedded", version = "7.9" }
spg-storage  = { path = "../../crates/spg-storage",  version = "7.9" }
sha2         = "0.10"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
clap         = { version = "4", features = ["derive"] }
tempfile     = "3"

[lints]
workspace = true
