[package]
name         = "spg-storage"
version      = { workspace = true }
edition      = { workspace = true }
authors      = { workspace = true }
license      = { workspace = true }
description  = "In-memory storage primitives for SPG: values, rows, table schema, catalog with foreign-key constraints."
repository   = { workspace = true }
categories   = ["database-implementations", "data-structures"]
keywords     = ["spg", "storage", "btree", "catalog", "no-std"]

[lints]
workspace = true

[dependencies]
spg-crypto = { workspace = true }
# v7.37.42-arena (T1) — bump arena for query-scoped Value lifetime.
# Direct dep instead of transitive so Value<'arena>'s bumpalo helpers
# (bumpalo::collections::Vec, bumpalo::collections::String) are reachable.
bumpalo    = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name    = "catalog"
harness = false
