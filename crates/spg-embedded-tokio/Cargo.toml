[package]
name         = "spg-embedded-tokio"
# v7.10.0 — new crate. First published version follows the
# workspace version (= the v7.10 series ship rollup), so we
# don't drift from the rest of the workspace.
version      = { workspace = true }
edition      = { workspace = true }
authors      = { workspace = true }
license      = { workspace = true }
readme       = "README.md"
repository   = { workspace = true }
description  = "Tokio-friendly async wrapper around spg-embedded. Single-writer Database serialised via tokio::sync::Mutex; blocking engine calls dispatched via spawn_blocking so the runtime never stalls on WAL fsync."
categories   = ["database", "asynchronous"]
keywords     = ["spg", "database", "async", "tokio", "embedded"]

[dependencies]
spg-embedded = { workspace = true }
# v7.10.0 — `rt` provides spawn_blocking; `sync` provides Mutex.
# No `macros`, no `net`, no `io-*` — keep the surface minimal so
# downstream consumers can run on any tokio runtime flavour
# (`current-thread` or multi-thread). Default features OFF for
# the same reason — we opt into the exact two we need.
# v7.37.14 — `time` belongs here, not only in dev-dependencies.
#
# `AsyncDatabase`'s checkpoint tick and the race guard both call
# `tokio::time::sleep`, in LIBRARY code. The feature was declared only
# under [dev-dependencies], and inside the workspace cargo's feature
# unification handed it to the library anyway, so it built here and
# nowhere else: `cargo publish` verifies the packaged crate on its own
# and stopped with `cannot find `time` in `tokio``. Anyone running
# `cargo add spg-embedded-tokio` would have met the same wall.
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }

# v7.10.0 — engine error types surface through the async API
# unchanged. Pulling spg-engine here too lets downstream `use
# spg_embedded_tokio::{AsyncDatabase, EngineError, QueryResult}`
# read clean without a separate import.
spg-engine = { workspace = true }

[dev-dependencies]
# `rt-multi-thread` + `macros` for the e2e tests' #[tokio::test].
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# v7.37.11 — dedup_tests use tempfile for per-test catalog paths.
tempfile = "3"

[lints]
workspace = true
