[package]
name         = "spg-embedded"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
authors      = { workspace = true }
license      = { workspace = true }
readme       = "README.md"
repository   = { workspace = true }
description  = "Embedded SQL database for Rust. Single-writer, WAL-backed, crash-safe. Zero external dependencies. PG-flavoured SQL with FOREIGN KEY, JOINs, vectors (HNSW/pgvector ops), and a cold tier."

[dependencies]
spg-engine  = { path = "../spg-engine" }
spg-storage = { path = "../spg-storage" }
# v7.1 — WAL record CRC32 (same algo + same on-disk format as
# `spg-server`, so an embedded-written DB boots cleanly on the
# server and vice versa).
spg-crypto  = { path = "../spg-crypto" }
# v7.1.4 — cold-segment manifest persistence (SPGMAN01 v10).
# Same bytes spg-server reads + writes, so a database an
# embedded process produces boots cleanly on the server (and
# vice versa) even with cold-tier state.
spg-manifest = { path = "../spg-manifest" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name    = "embedded"
harness = false

[lints]
workspace = true
