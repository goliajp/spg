[workspace]
resolver = "3"
members = [
    "crates/spg-wire",
    "crates/spg-sql",
    "crates/spg-server",
    "crates/spg-cli",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
authors      = ["lihao <lihao@golia.jp>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/lihao/spg"

[workspace.lints.rust]
unsafe_code            = "forbid"
unused_must_use        = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic carve-outs to avoid clippy::pedantic noise on early code.
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
must_use_candidate      = "allow"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.release-dbg]
inherits = "release"
debug    = "line-tables-only"
strip    = "none"
