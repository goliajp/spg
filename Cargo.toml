[workspace]
resolver = "3"
members = [
    "crates/spg-wire",
    "crates/spg-sql",
    "crates/spg-storage",
    "crates/spg-crypto",
    "crates/spg-audit",
    "crates/spg-engine",
    "crates/spg-embedded",
    "crates/spg-embedded-tokio",
    "crates/spg-manifest",
    "crates/spg-server",
    "crates/spg-sqlx",
    "crates/spgctl",
    "xtests/sqllogictest",
    "xtests/sqlx-pgwire",
    "xbench/competitor",
]

[workspace.package]
version      = "7.34.6"
edition      = "2024"
rust-version = "1.95"
authors      = ["GOLIA K.K. <lihao@golia.jp>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/goliajp/spg"

# Shared workspace dev-dependencies. Each crate's bench harness pulls
# criterion from here so the version is locked across stones; that
# matters because criterion's stats / sample analysis can shift
# percentages between minor releases.
[workspace.dependencies]
hashbrown   = { version = "0.15", default-features = false, features = ["default-hasher"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# v7.8.1 — internal crates declared once here so `cargo publish` sees
# `version = "X.Y"` alongside the `path = …`. crates.io strips paths
# and uses the version; `path` keeps local development from going via
# the registry. All ten crates share the workspace version.
spg-wire     = { path = "crates/spg-wire", version = "7.34" }
spg-crypto   = { path = "crates/spg-crypto", version = "7.34" }
spg-sql      = { path = "crates/spg-sql", version = "7.34" }
spg-storage  = { path = "crates/spg-storage", version = "7.34" }
spg-audit    = { path = "crates/spg-audit", version = "7.34" }
spg-manifest = { path = "crates/spg-manifest", version = "7.34" }
spg-engine   = { path = "crates/spg-engine", version = "7.34" }
spg-embedded = { path = "crates/spg-embedded", version = "7.34" }
# v7.10.0 — tokio adapter for spg-embedded. Bumps the published
# version to 7.10 right at introduction; spg-embedded stays 0-deps
# and this is the *only* crate that pulls tokio.
spg-embedded-tokio = { path = "crates/spg-embedded-tokio", version = "7.34" }
# v7.16.0 — sqlx 0.8 adapter for spg-embedded. Lets mailrs-shape
# in-process callers use sqlx::query / query_as / pool.begin against
# an in-process SPG (no TCP listener).
spg-sqlx = { path = "crates/spg-sqlx", version = "7.34" }

[workspace.lints.rust]
# v3.0.4: relaxed from `forbid` to `deny` so spg-crypto can drop into
# inline NEON / AVX2 intrinsics (all unsafe). The crate-level allow is
# narrowly scoped — every other workspace crate still inherits `deny`
# and must justify any new unsafe block.
unsafe_code            = "deny"
unused_must_use        = "deny"
# Tests often hold a `let mut` against an Engine handle to keep
# `execute()` working — clippy fires `unused_mut` on the test fns
# that only use `&self` paths. Allow it across the workspace so
# we don't have to babysit every test edit.
unused_mut             = "allow"
unused_variables       = "allow"
dead_code              = "allow"
missing_debug_implementations = "warn"
# Test fns may use non-snake-case names like `vector_kNN_ranking`
# (kNN is a standard term of art). Don't gate CI on this.
non_snake_case         = "allow"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic carve-outs to avoid clippy::pedantic noise on early code.
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
must_use_candidate      = "allow"
# CI runs with `-D warnings`, which promotes every clippy::pedantic
# warning to an error. The carve-outs below silence the noisiest
# style-class lints that shouldn't gate CI:
#   - uninlined_format_args / doc_markdown / needless_continue /
#     manual_let_else / match_same_arms / too_many_lines: cosmetic
#     style preferences.
#   - cast_sign_loss / cast_possible_truncation / cast_possible_wrap /
#     cast_precision_loss: routinely intentional at storage / wire
#     boundaries; spot-allow at call sites would just clutter the code.
#   - format_push_string / similar_names / wildcard_imports: cosmetic.
#   - if_not_else / single_match_else / range_plus_one / no_effect_underscore_binding:
#     stylistic preferences that fire constantly with no real bug-catching value.
uninlined_format_args   = "allow"
doc_markdown            = "allow"
needless_continue       = "allow"
manual_let_else         = "allow"
match_same_arms         = "allow"
too_many_lines          = "allow"
cast_sign_loss          = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap      = "allow"
cast_precision_loss     = "allow"
cast_lossless           = "allow"
format_push_string      = "allow"
similar_names           = "allow"
wildcard_imports        = "allow"
if_not_else             = "allow"
single_match_else       = "allow"
range_plus_one          = "allow"
no_effect_underscore_binding = "allow"
needless_pass_by_value  = "allow"
unreadable_literal      = "allow"
unnecessary_wraps       = "allow"
struct_field_names      = "allow"
items_after_statements  = "allow"
ignored_unit_patterns   = "allow"
elidable_lifetime_names = "allow"
# Style preferences that fire from clippy::all but don't add safety value:
for_kv_map              = "allow"
semicolon_if_nothing_returned = "allow"
useless_format          = "allow"
explicit_iter_loop      = "allow"
# Doc-style + stylistic carve-outs from newer clippy releases:
doc_overindented_list_items = "allow"
doc_lazy_continuation   = "allow"
manual_is_multiple_of   = "allow"
manual_div_ceil         = "allow"
manual_midpoint         = "allow"
manual_clamp            = "allow"
manual_contains         = "allow"
manual_checked_ops      = "allow"
collapsible_if          = "allow"
unused_self             = "allow"
unnecessary_lazy_evaluations = "allow"
return_self_not_must_use = "allow"
redundant_closure_for_method_calls = "allow"
redundant_closure       = "allow"
needless_option_as_deref = "allow"
map_unwrap_or           = "allow"
many_single_char_names  = "allow"
assigning_clones        = "allow"
needless_collect        = "allow"
unnecessary_map_or      = "allow"
ref_option              = "allow"
let_and_return          = "allow"
needless_raw_string_hashes = "allow"
from_iter_instead_of_collect = "allow"
float_cmp               = "allow"
float_cmp_const         = "allow"
missing_const_for_fn    = "allow"
should_panic_without_expect = "allow"
ignore_without_reason   = "allow"
duration_subsec         = "allow"
case_sensitive_file_extension_comparisons = "allow"
manual_assert           = "allow"
unnested_or_patterns    = "allow"
collapsible_match       = "allow"
len_zero                = "allow"
comparison_chain        = "allow"
bool_assert_comparison  = "allow"
single_char_pattern     = "allow"
unnecessary_to_owned    = "allow"
duration_suboptimal_units = "allow"
needless_range_loop     = "allow"
approx_constant         = "allow"
stable_sort_primitive   = "allow"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.release-dbg]
inherits = "release"
debug    = "line-tables-only"
strip    = "none"
