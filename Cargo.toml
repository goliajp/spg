[workspace]
resolver = "3"
members = [
    "crates/spg-wire",
    "crates/spg-sql",
    "crates/spg-storage",
    "crates/spg-crypto",
    "crates/spg-audit",
    "crates/spg-engine",
    "crates/spg-embedded",
    "crates/spg-manifest",
    "crates/spg-server",
    "crates/spg-cli",
    "xtests/sqllogictest",
    "xbench/competitor",
]

[workspace.package]
version      = "7.6.2"
edition      = "2024"
rust-version = "1.95"
authors      = ["lihao <lihao@golia.jp>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/lihao/spg"

# Shared workspace dev-dependencies. Each crate's bench harness pulls
# criterion from here so the version is locked across stones; that
# matters because criterion's stats / sample analysis can shift
# percentages between minor releases.
[workspace.dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
# v3.0.4: relaxed from `forbid` to `deny` so spg-crypto can drop into
# inline NEON / AVX2 intrinsics (all unsafe). The crate-level allow is
# narrowly scoped — every other workspace crate still inherits `deny`
# and must justify any new unsafe block.
unsafe_code            = "deny"
unused_must_use        = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic carve-outs to avoid clippy::pedantic noise on early code.
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
must_use_candidate      = "allow"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.release-dbg]
inherits = "release"
debug    = "line-tables-only"
strip    = "none"
