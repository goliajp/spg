name: CI

# git-flow trigger map. Heavy gates (prod_ready, slo_smoke, perf_gate,
# release-build) gate by branch via `if:` so feature/bugfix pushes get
# fast feedback while release/hotfix + integration lines (develop, master)
# run the full battery. See .claude/git-flow.md for the mapping table.
on:
  push:
    branches:
      - master
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches: [master, main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clippy
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --workspace
        run: cargo build --workspace --locked
      - name: cargo test --workspace
        # Replication and backup e2e tests spawn `spg-server` child
        # processes; serial runner keeps port-grabbing tests honest.
        run: cargo test --workspace --locked -- --test-threads=1

  prod_ready:
    name: prod_ready gate
    runs-on: ubuntu-latest
    # The prod_ready test asserts every [machine] row in PROD_READY.md
    # is backed by a row_X_Y_* test in crates/spg-server/tests/prod_ready.rs.
    # Failure here means PROD_READY.md is over-claiming.
    #
    # v7.11.x context — PROD_READY.md / DEPLOYMENT.md / RUNBOOK.md /
    # PERFORMANCE.md live under `.claude/internal-docs/` (gitignored by
    # project convention) so they're not present at workspace root on a
    # fresh CI clone. v7.12.8 promoted the harness to gracefully skip
    # doc-presence checks when the source file is absent (see
    # `prod_doc_missing` / `assert_doc_has_sections` in prod_ready.rs);
    # the gate now actually runs (45 / 45 on master CI as of v7.12.7),
    # so the v7.11.x `continue-on-error` soft-fail is gone.
    #
    # Skipped on plain feature/bugfix pushes — runs on every PR (so the
    # gate fires before merge to develop/master) and on any push to
    # integration / release lines.
    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/hotfix/')
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --release --test prod_ready
        run: cargo test --release -p spg-server --test prod_ready --locked

  slo_smoke:
    name: SLO smoke
    runs-on: ubuntu-latest
    # v4.32 — the fast SLO gate from PERFORMANCE.md §SLO. Runs in < 5 s
    # on a normal runner. SLO ceilings are intentionally loose
    # (~2-3× v4.27 baseline) so shared-runner noise doesn't false-alarm.
    #
    # Same gate policy as prod_ready: PRs + integration/release pushes only.
    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/hotfix/')
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --release --test slo_smoke
        run: cargo test --release -p spg-server --test slo_smoke --locked -- --nocapture

  perf_gate:
    name: perf_gate (release)
    runs-on: ubuntu-latest
    # Every crate's perf_gate target is wrapped in
    # `#![cfg(not(debug_assertions))]`, so the workspace-wide debug
    # `test` job above produces empty perf_gate binaries. This job is
    # the real gate — release build, one crate at a time so a single
    # failure points at exactly which gate regressed.
    #
    # v7.21 — the standalone perf_* binaries (join_reorder /
    # plan_cache / stages_knn in spg-engine; 1b_rows / concurrency /
    # sq8 / parallel_freezer / prefetch / prepared_vs_simple in
    # spg-server) were folded into per-crate perf_gate targets, so
    # spg-server joined the loop. Fast tier runs here; the
    # `#[ignore]`d full tier is `scripts/gate.sh gates --full`.
    #
    # Same gate policy as prod_ready / slo_smoke: PRs + integration /
    # release lines. Skipped on plain feature/bugfix pushes.
    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/hotfix/')
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --release perf_gate × crates
        run: |
          set -euo pipefail
          for crate in spg-audit spg-crypto spg-engine spg-sql spg-storage spg-wire spgctl spg-server; do
            echo "::group::perf_gate ${crate}"
            cargo test --release -p "${crate}" --test perf_gate --locked -- --test-threads=1 --nocapture
            echo "::endgroup::"
          done

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    # v4.31: license allowlist + duplicate-version check via cargo-deny.
    # Config in deny.toml.
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  secret_scan:
    name: secret scan (trufflehog)
    runs-on: ubuntu-latest
    # v4.32 originally used gitleaks/gitleaks-action@v2 for secret
    # scanning. gitleaks v2 added an org-license gate in 2026 that
    # would have us paying per-month; v7.12.8 swaps to trufflehog
    # which stays free for OSS / org use. v7.12.9 hotfix narrows
    # the trigger config — passing `base: default_branch + head:
    # HEAD` on a push-to-master event tells trufflehog the diff is
    # master..master (empty) and the action errors out with "BASE
    # and HEAD commits are the same".
    #
    # Fix: drop the explicit base/head, omit `path` (so the action
    # picks its event-aware default). The action then:
    #   - on push, scans the commits introduced by the push range
    #   - on pull_request, scans the PR's diff vs the base ref
    #   - on workflow_dispatch / schedule, scans the whole tree
    #
    # `--results=verified,unknown` keeps the signal high — only
    # credentials the action could actually probe against an
    # issuing service (verified) plus genuinely-novel matches
    # the action's analyzers don't recognise (unknown).
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: trufflehog scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  dropin_acceptance:
    name: drop-in acceptance (PG dialect + mailrs fixture)
    runs-on: ubuntu-latest
    # v7.18 — boots the published SPG image and feeds the
    # scripts/dropin-acceptance.sh probe (35-case PG dialect panel +
    # mailrs init-schema.sql / pg-extensions.sql as first real
    # customer fixture). Any regression in PG drop-in compatibility
    # — a stock PG schema that worked yesterday but parser-fails
    # today — flips this gate red.
    #
    # v7.24.1 — HARD GATE. goliakk/spg:7.24.1 passes the full
    # 42-case panel (40 dialect cases incl. the four round-12
    # probes + 2 mailrs fixtures); the checked-in
    # reference is scripts/dropin-acceptance-report-v7.24.1.md.
    # Any case that flips ✅→❌ between releases is a release
    # blocker. Bump the --image arg when the next release image
    # is published.
    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/hotfix/')
    steps:
      - uses: actions/checkout@v4
      - name: drop-in acceptance harness
        run: |
          scripts/dropin-acceptance.sh \
            --image goliakk/spg:7.24.1 \
            --port 25433 \
            --fixture scripts/fixtures/mailrs-pg-extensions.sql \
            --fixture scripts/fixtures/mailrs-init-schema-v1.7.142.sql \
            --report ./dropin-acceptance-report.md
      - name: Upload drop-in acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropin-acceptance-report
          path: ./dropin-acceptance-report.md

  release-build:
    name: release build (sanity)
    runs-on: ubuntu-latest
    # Catches optimization-only bugs and confirms the production binary
    # still links cleanly. Runs on anything that will land on master:
    # master/main push, release/** + hotfix/** push, and PRs targeting
    # master/main. Skipped on feature/develop to keep their CI quick.
    if: |
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/heads/hotfix/')
      )) ||
      (github.event_name == 'pull_request' && (
        github.base_ref == 'master' || github.base_ref == 'main'
      ))
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release -p spg-server
        run: cargo build --release -p spg-server --locked
      - name: Upload spg-server binary
        # Only upload on master/main pushes — release/hotfix branches
        # produce the same binary but it's the master tag that we keep.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: spg-server-linux-amd64
          path: target/release/spg-server
          retention-days: 14
