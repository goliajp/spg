name: CI

# git-flow trigger map — push-only, no PRs. All merges happen locally
# via `git flow {feature,bugfix,release,hotfix} finish`; what reaches
# origin is already-merged history.
#
# v7.39.11 — every push runs `check` plus the three supply-chain jobs.
# The release-profile battery runs on `develop` alone, because that is
# where every finish lands: a change passes it exactly once there, and
# the release branch and the master merge carry the identical tree,
# already certified by `scripts/suite.sh prerelease` locally before the
# release is cut. Running it again on those pushes measures the same
# commit a third time and is most of what made a release slow.
#
# Twelve jobs became five, and nineteen runners on a develop push
# became five, by paying each build once instead of once per question
# asked of it. See .claude/git-flow.md for the branch map.
on:
  push:
    branches:
      - master
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
      - 'bugfix/**'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # v7.39.11 — one runner, one cache, one debug build.
  #
  # `fmt`, `clippy` and `test` were three jobs on three runners, and
  # clippy and test compile the same workspace in the same profile —
  # so the debug build was paid twice on two machines to answer two
  # questions about one tree. rustfmt and clippy also ship with the
  # runner image; `rustup component add` was installing what was
  # already there.
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        # Replication and backup e2e tests spawn `spg-server` child
        # processes; serial runner keeps port-grabbing tests honest.
        run: cargo test --workspace --locked -- --test-threads=1

  # v7.39.11 — the release-profile battery, on one runner, after ONE
  # release build.
  #
  # This was eleven jobs: `prod_ready`, `slo_smoke`, `sqllogictest`,
  # `release-build`, `dropin_acceptance`, and a `perf_gate` matrix of
  # eight. Every one of them began by compiling the workspace in
  # release, so the same build ran eleven times on eleven machines to
  # run gates whose own runtime is seconds. The matrix bought
  # max-of-8 instead of sum-of-8 on the GATES while paying 8x for the
  # BUILD they all shared, and each leg restored its own multi-GB
  # cache to do it.
  #
  # Ordered cheapest-first so a red arrives early. `fail-fast` is
  # gone with the matrix, so the loop keeps going and names every
  # failing crate in one run, which is what the matrix's
  # `fail-fast: false` was for.
  #
  # Runs on `develop` only. Every git-flow finish lands there, so
  # every change passes this exactly once; a release branch and a
  # master merge carry the same tree, already gated here and again by
  # `scripts/suite.sh prerelease` locally before the release is cut.
  # Re-running it on those pushes measures the same commit a third
  # time.
  release_gates:
    name: release-profile gates
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binaries once
        run: cargo build --release --locked --bin spg-server --bin spg --bin pg_isready
      - name: prod_ready gate
        # Asserts every [machine] row in PROD_READY.md is backed by a
        # row_X_Y_* test. Failure means PROD_READY.md is over-claiming.
        run: cargo test --release -p spg-server --test prod_ready --locked
      - name: SLO smoke
        # Ceilings are deliberately loose (~2-3x baseline) so
        # shared-runner noise does not false-alarm.
        run: cargo test --release -p spg-server --test slo_smoke --locked -- --nocapture
      - name: perf_gate (every crate)
        # Each crate's perf_gate is `#![cfg(not(debug_assertions))]`,
        # so the debug `test` job above builds it empty; this is the
        # real gate. One crate at a time so a failure names which.
        run: |
          set -uo pipefail
          rc=0
          for c in spg-audit spg-crypto spg-engine spg-sql spg-storage spg-wire spgctl spg-server; do
            echo "::group::perf_gate $c"
            cargo test --release -p "$c" --test perf_gate --locked -- --test-threads=1 --nocapture || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - name: biz (sqllogictest)
        run: cargo run -p sqllogictest --release --locked
      - name: Assemble candidate image
        # The panel used to run against the previously PUBLISHED
        # image, which tested a constant: it could never catch a
        # regression in the commit under test, and the hand-bumped tag
        # drifted. The published image is watched by the nightly
        # sentinel workflow (dropin-published.yml) instead.
        run: |
          mkdir -p target/ci-image
          cp target/release/spg-server target/release/spg target/release/pg_isready target/ci-image/
          docker build -f Dockerfile.ci -t spg-candidate:ci target/ci-image
      - name: drop-in acceptance
        # HARD GATE since v7.29: any case that flips OK to FAIL is a
        # release blocker.
        run: |
          scripts/dropin-acceptance.sh \
            --image spg-candidate:ci \
            --no-pull \
            --port 25433 \
            --fixture scripts/fixtures/mailrs-pg-extensions.sql \
            --fixture scripts/fixtures/mailrs-init-schema-v1.7.142.sql \
            --report ./dropin-acceptance-report.md
      - name: Upload drop-in acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dropin-acceptance-report
          path: ./dropin-acceptance-report.md
      - name: Upload spg-server binary
        uses: actions/upload-artifact@v7
        with:
          name: spg-server-linux-amd64
          path: target/release/spg-server
          retention-days: 14

  # The three below compile no Rust of ours and answer questions no
  # local run does, so they stay their own runners on every push.
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit (prebuilt)
        # rustsec/audit-check compiled it from source on every run
        # (~190 s); install-action drops in the prebuilt binary. Same
        # advisory DB, same failure semantics via the exit code.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    # License allowlist + duplicate-version check. Config in deny.toml.
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  secret_scan:
    name: secret scan (trufflehog)
    runs-on: ubuntu-latest
    # gitleaks v2 added an org-license gate in 2026; trufflehog stays
    # free for OSS / org use. No explicit base/head: on a push to
    # master those are the same commit and the action errors out, so
    # the event-aware default picks the push range itself.
    #
    # `--results=verified,unknown` keeps the signal high — only
    # credentials the action could probe against an issuing service,
    # plus genuinely-novel matches its analyzers do not recognise.
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: trufflehog scan
        # Pinned to a release tag, not @main — a moving branch ref is
        # the opposite of stable.
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          extra_args: --results=verified,unknown
