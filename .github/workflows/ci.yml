name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clippy
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --workspace
        run: cargo build --workspace --locked
      - name: cargo test --workspace
        # Replication and backup e2e tests spawn `spg-server` child
        # processes; serial runner keeps port-grabbing tests honest.
        run: cargo test --workspace --locked -- --test-threads=1

  prod_ready:
    name: prod_ready gate
    runs-on: ubuntu-latest
    # The prod_ready test asserts every [machine] row in
    # PROD_READY.md is backed by a row_X_Y_* test in
    # crates/spg-server/tests/prod_ready.rs. Failure here means
    # PROD_READY.md is over-claiming.
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --release --test prod_ready
        run: cargo test --release -p spg-server --test prod_ready --locked

  slo_smoke:
    name: SLO smoke
    runs-on: ubuntu-latest
    # v4.32 — the fast SLO gate from PERFORMANCE.md §SLO. Runs
    # in < 5 s on a normal runner. SLO ceilings are intentionally
    # loose (~2-3× v4.27 baseline) so shared-runner noise doesn't
    # false-alarm.
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --release --test slo_smoke
        run: cargo test --release -p spg-server --test slo_smoke --locked -- --nocapture

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    # v4.31: license allowlist + duplicate-version check via
    # cargo-deny. Config in deny.toml.
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # v4.32: secret scanning. Fails the build on any high-entropy
    # string / common API key format committed in the diff.
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-build:
    name: release build (sanity)
    runs-on: ubuntu-latest
    # Catches optimization-only bugs and confirms the production
    # binary still links cleanly — runs only on main-branch pushes
    # to keep PR CI fast.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release -p spg-server
        run: cargo build --release -p spg-server --locked
      - name: Upload spg-server binary
        uses: actions/upload-artifact@v4
        with:
          name: spg-server-linux-amd64
          path: target/release/spg-server
          retention-days: 14
