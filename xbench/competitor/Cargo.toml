[package]
name         = "spg-bench-competitor"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
authors      = { workspace = true }
license      = { workspace = true }
description  = "Side-by-side benchmark harness: SPG vs Postgres / MySQL / MariaDB."
publish      = false

# This crate intentionally pulls external Rust deps (sqlx, tokio,
# criterion). Those deps are *only* present in this xbench crate —
# spg-wire / spg-sql / spg-storage / spg-engine / spg-server / spg-cli
# stay pure-stdlib / pure-alloc as before. The workspace lints carve
# out unsafe_code for spg-crypto; this crate inherits the default deny.

[dependencies]
spg-engine  = { path = "../../crates/spg-engine" }
spg-storage = { path = "../../crates/spg-storage" }
spg-wire    = { path = "../../crates/spg-wire" }
spg-sql     = { path = "../../crates/spg-sql" }
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "mysql",
    "runtime-tokio",
    "macros",
    "any",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[dev-dependencies]
criterion = { workspace = true }

[[bin]]
name = "smoke"
path = "src/smoke.rs"

[[bin]]
name = "latency"
path = "src/bin/latency.rs"

[[bin]]
name = "throughput"
path = "src/bin/throughput.rs"

[[bin]]
name = "vector_knn"
path = "src/bin/vector_knn.rs"

[[bin]]
name = "memory"
path = "src/bin/memory.rs"

[[bin]]
name = "large_data"
path = "src/bin/large_data.rs"

[[bin]]
name = "soak"
path = "src/bin/soak.rs"

[[bin]]
name = "concurrent"
path = "src/bin/concurrent.rs"

[[bin]]
name = "repl_bench"
path = "src/bin/repl_bench.rs"

[[bin]]
name = "backup_bench"
path = "src/bin/backup_bench.rs"

[[bin]]
name = "bake_segment"
path = "src/bin/bake_segment.rs"

[[bin]]
name = "cold_tier_pk_bench"
path = "src/bin/cold_tier_pk_bench.rs"

[lints.rust]
unsafe_code     = "deny"
unused_must_use = "deny"

[lints.clippy]
# Bench harness — workspace pedantic is too noisy for one-off measurement
# code (cast lints + doc-markdown + Duration-unit suggestions are signal
# for spg-core, but distractions in benches that target known shapes).
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions  = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
must_use_candidate       = "allow"
cast_sign_loss           = "allow"
cast_possible_wrap       = "allow"
cast_possible_truncation = "allow"
cast_precision_loss      = "allow"
cast_lossless            = "allow"
unnecessary_cast         = "allow"
checked_conversions      = "allow"
doc_markdown             = "allow"
ptr_arg                  = "allow"
